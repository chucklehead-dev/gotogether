# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
#
# qenv/weave aspects: the root module's sync.Mutex, sync.RWMutex and
# sync.WaitGroup method calls, and go statements marked //qenv:go, become
# calls of package woven (the woven builds' ABI), which are simulated
# inside a qenv simulation and the real thing outside it. A project opts
# in by importing github.com/chucklehead-dev/gotogether/qenv/weave in its
# orchestrion.tool.go and building with `orchestrion go test` (or qweave).
# Only the root module's packages are rewritten: the standard library and
# dependencies keep their own locks, which is right as long as they do
# not block across simulated time (see package woven's doc).
#
# One aspect per method and receiver form (a value or a pointer
# receiver expression); a new sync method gets both, and its function in
# package woven.
meta:
  name: github.com/chucklehead-dev/gotogether/qenv/weave
  description: Run code that uses sync locks, wait groups and go statements inside a qenv simulation.

aspects:
  - id: qenv-go
    join-point:
      all-of:
        - package-filter: { root: true }
        - directive: 'qenv:go'
        - function: []
    advice:
      - wrap-expression:
          imports:
            woven: github.com/chucklehead-dev/gotogether/woven
          template: 'woven.Go({{ . }})'
  - id: qenv-mutex-lock-value
    join-point:
      all-of:
        - package-filter: { root: true }
        - method-call: { receiver: 'sync.Mutex', name: Lock, match: value-only }
    advice:
      - wrap-expression:
          imports:
            woven: github.com/chucklehead-dev/gotogether/woven
          template: 'woven.MutexLock(&{{ .AST.Fun.X }})'
  - id: qenv-mutex-lock-pointer
    join-point:
      all-of:
        - package-filter: { root: true }
        - method-call: { receiver: 'sync.Mutex', name: Lock, match: pointer-only }
    advice:
      - wrap-expression:
          imports:
            woven: github.com/chucklehead-dev/gotogether/woven
          template: 'woven.MutexLock({{ .AST.Fun.X }})'
  - id: qenv-mutex-unlock-value
    join-point:
      all-of:
        - package-filter: { root: true }
        - method-call: { receiver: 'sync.Mutex', name: Unlock, match: value-only }
