spec: vending.qnt
module: vending
constants:
  PRICE: '2'
  STOCK: '2'
actions:
  insert: {}
  buy: { args: { result: '{{.outcome}}' } }
  refund: {}
  repair: {}
invariants: [nonNegative]
simulate:
  holds: [nonNegative]
  steps: 12
  samples: 300
  possible:
    - soldOut
    - refund
    - name: sold out after a short purchase
      steps: [insert, 'buy(result = "short")', 'buy(result = "ok")', 'buy(result = "empty")']
