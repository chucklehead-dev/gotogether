# account.yaml with a snapshot: a log that lost its head starts from the
# state its first step recorded (snapshot_test.go).
spec: account.qnt
module: account
constants:
  LIMIT: '100'
snapshot: restore
actions:
  # templates given: the itf command plans without the model
  restore:
    args: { b: '{{.b}}', n: '{{.n}}' }
  deposit:
    args: { amount: '{{.amount}}' }
    expect: 'balance == {{.obs.balance}}'
  withdraw:
    args: { amount: '{{.amount}}' }
    expect: 'balance == {{.obs.balance}}'
invariants: [nonNegative, underLimit]
