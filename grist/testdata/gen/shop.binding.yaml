# Generated by grist model from the shop App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/shop.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/shop.qnt
module: shop

outcomes:
  ok: '"ok"'
  closed: '"closed"'
  full: '"full"'
  no-stock: '"no-stock"'
  unknown: '"unknown"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  addItem:
    args: { item_: '{{.args.item}}', of_: '{{.args.of}}', result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  noteItem:
    args: { item_: '{{.args.item}}', result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  count:
    expect: 'countAnswer(log, { caller: {{.caller}} }) == {{.obs.result}}'
  showItem:
    args: { item_: '{{.args.item}}' }
    expect: 'showItemAnswer(log, { item: {{.item}}, caller: {{.caller}} }) == { qty: {{.obs.qty}}, shipped: {{.obs.shipped}} }'
  ship:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("ship") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  notifyEffect: {}
  notify:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("notify") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  notifyOutcome: {}
  notifySkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("notify") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  chargeSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("charge") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  charge:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("charge") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  chargeEffect: {}
  chargeOutcome:
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  warehousePicks:
    args: { item_: '{{.args.item}}' }
  warehouseHold:
    args: { item_: '{{.args.item}}', result: '{{.outcome}}' }
  warehouseHoldServed:
    args: { item_: '{{.args.item}}', result: '{{.outcome}}' }
  warehouseHoldReplayed:
    args: { item_: '{{.args.item}}', result: '{{.outcome}}' }
  gristRewound: {}
  gristResumed: {}

invariants: [stockBounded]
eventually: [allShipped, shipEventuallyHandled, notifyEventuallyHandled, chargeEventuallyHandled, warehouseHoldEventuallyServed]

# The model on its own (gotogether simulate)
simulate:
  holds: [stockBounded]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: addItem.ok
      when: 'nextID(answered) != Set() and STRS.exists(item_ => INTS.exists(qty => STRS.exists(of_ => STRS.exists(caller => addItemRuled(log, { item: item_, qty: qty, of: of_, caller: caller }).outcome == "ok"))))'
    - name: addItem.full
      when: 'nextID(answered) != Set() and STRS.exists(item_ => INTS.exists(qty => STRS.exists(of_ => STRS.exists(caller => addItemRuled(log, { item: item_, qty: qty, of: of_, caller: caller }).outcome == "full"))))'
    - name: addItem.closed
      when: 'nextID(answered) != Set() and STRS.exists(item_ => INTS.exists(qty => STRS.exists(of_ => STRS.exists(caller => addItemRuled(log, { item: item_, qty: qty, of: of_, caller: caller }).outcome == "closed"))))'
    - name: noteItem.ok
      when: 'nextID(answered) != Set() and STRS.exists(item_ => STRS.exists(caller => noteItemOutcome(log, { item: item_, caller: caller }) == "ok"))'
    - count
    - showItem
    - ship
    - notifyEffect
    - notify
    - chargeEffect
    - charge
    - warehouseHold
    - warehouseHoldServed
    - warehousePicks
