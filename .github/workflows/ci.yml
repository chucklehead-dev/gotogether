name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  QUINT_VERSION: 0.33.0
  # every module is tested on its own go.mod: go.work is for development
  GOWORK: "off"
  # every toolkit skip (no quint, no mutants woven, SkipIfEmpty's) fails:
  # each job installs what its tests need, so a skip here is a lost tool or
  # a lost weaving step. Steps where a skip is legitimate say why: the
  # examples' mutation and coverage tests unwoven (skipped by name),
  # edgepublish's unwoven run. The jobs without quint (consumable, qweave)
  # run no test that skips. Opt-in gates (GOTOGETHER_VERIFY, RAFTKV_REAL,
  # -short) are plain skips, not the toolkit's.
  GOTOGETHER_STRICT: "1"
  # quint judges one in five of the Go evaluator's passes too (a pass
  # it rejects fails its run, saying the evaluator passed it), where a
  # user's default is one in fifty: docs/DESIGN.md §56
  GOTOGETHER_EVAL_SAMPLE: "1/5"

jobs:
  test:
    # one job ran every part in turn: its parts run side by side. The
    # core's variants (self-checks, the TypeScript backend), its race
    # detector and the examples' demos are parts of their own, so none
    # follows another on the critical path (run 431: core-variants 12.9
    # minutes with the race detector, examples 13.0 with the demos).
    strategy:
      fail-fast: false
      matrix:
        part: [core, core-variants, race, shuffle, hegel, examples, demos, tools]
    name: test (${{ matrix.part }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: Install toxiproxy-server (qnemesis' network tests, strict here)
        if: matrix.part == 'core' || matrix.part == 'race' || matrix.part == 'shuffle'
        run: |
          go install github.com/Shopify/toxiproxy/v2/cmd/server@v2.12.0
          mv "$(go env GOPATH)/bin/server" "$(go env GOPATH)/bin/toxiproxy-server"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gofmt
        if: matrix.part == 'core'
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        if: matrix.part == 'core'
        run: go vet ./...
      - name: test
        if: matrix.part == 'core'
        run: |
          # every test binary run under cputime, which counts its CPU time
          # and its quint processes' (wall times here are the neighbours' too)
          go build -o "$RUNNER_TEMP/cputime" ./internal/cputime
          GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/core-cpu.txt" go test -exec "$RUNNER_TEMP/cputime" -count=1 -timeout 30m ./...
          # a core package costing twice the CPU seconds it did (ci/test-times.txt) fails
          sort -k2,2nr "$RUNNER_TEMP/core-cpu.txt"
          ci/time-budget.sh < "$RUNNER_TEMP/core-cpu.txt"
      - name: every module tidy on its own go.mod
        if: matrix.part == 'core'
        # but ci/consumer, whose go.mod requires nothing on purpose: the
        # consumer job go-gets the published modules at the pushed commit,
        # as a user would, and a go.mod complete here would name an older
        # commit, stale at every push
        run: |
          for m in $(git ls-files '*go.mod' | xargs -n1 dirname | grep -v -e testdata -e '^ci/consumer$'); do
            (cd "$m" && go mod tidy -diff) || { echo "::error::$m: go mod tidy"; exit 1; }
          done
      - name: simulation code stays in the simulation
        if: matrix.part == 'core'
        run: go run ./cmd/gotogether lint -sim .
      - name: the race detector on what runs real goroutines
        if: matrix.part == 'race'
        # qtest's explorations run seeds in parallel goroutines, qnemesis
        # drives real processes; all passed the detector when added
        # (eleventh review, M5)
        run: |
          go test -race -short -count=1 ./qobs/ ./qtrace/ ./validate/ ./qrun/ ./otelio/ ./convert/ ./binding/ ./itf/ \
            ./qtest/ ./qhistory/ ./qsweep/ ./qnemesis/ ./qload/ ./qshrink/ ./internal/qeval/
          go test -race -short -count=1 -run 'Native|Synctest|Signal' ./qenv/
          # Hegel's output captured at descriptor 1, os.Stdout never assigned
          (cd qhegel && go test -race -count=1 -run '^TestCaptureStdoutAtTheDescriptor$' .)
      - name: the race detector on grist's real tier (Main, the platform, calls over HTTP, two pods)
        if: matrix.part == 'race'
        # grist on its own go.mod (its pinned core), the pods the test
        # binary built with -race: a race in a pod ends it with exit 66
        run: |
          (cd grist && go test -race -short -count=1 -run '^(TestMain|TestDrainBudget|TestMemoryLimit|TestMetricsLabelEscaping|TestPauseIsProgress|TestCallOverHTTP|TestServeCalls|TestOverHTTPAnswers|TestCallAnswerOfNoRefusal)' .)
          (cd examples/counters && go test -race -count=1 -run '^TestRealTwoPods$' .)
      - name: the core's -short tests shuffled, twice (no test depends on another's order or state)
        if: matrix.part == 'shuffle'
        # TestFaultPoints passed or failed by order (a process-wide
        # registry: eleventh review, M1); -count=2 runs each test after
        # itself too. A failure prints the -shuffle seed that replays it.
        run: go test -short -shuffle=on -count=2 -timeout 40m ./...
      - name: test (qenv self-checks)
        if: matrix.part == 'core-variants'
        run: GOTOGETHER_CHECK=1 go test -short -count=1 ./qenv/ ./qload/ ./qtest/ ./qcover/ ./qrun/
      - name: test (typescript backend)
        if: matrix.part == 'core-variants'
        run: |
          QUINT_BACKEND=typescript go test -short -count=1 ./connect/ ./validate/
          (cd examples/bank && QUINT_BACKEND=typescript go test -short -count=1 .)
      - name: qhegel (its own module, so the core needs no Hegel)
        if: matrix.part == 'hegel'
        working-directory: qhegel
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go test -count=1 -timeout 30m ./...
      - name: the core's Hegel properties, on this checkout's core (internal/hegelprops replaces it)
        if: matrix.part == 'hegel'
        working-directory: internal/hegelprops
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          GOTOGETHER_CHECK=1 go test -count=1 -timeout 30m ./...
      # the per-push tier: each example's -short tests, under a minute each
      # (TestMutationOf* and TestCodeCoverage skip unwoven, and strict mode
      # would fail them: hello's mutants and checkout's coverage run woven
      # in the tools part)
      # (ci/test-times.txt), every mutant they claim caught with at least
      # 0.95 (their reports print the chance a claim of Some misses); the
      # full explorations and searches run nightly, at fresh seeds
      - name: the examples, each its own module
        if: matrix.part == 'examples'
        run: |
          go build -o "$RUNNER_TEMP/gotogether" ./cmd/gotogether
          go build -o "$RUNNER_TEMP/cputime" ./internal/cputime
          export GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/cpu.txt"
          for m in bank checkout counters glomers hello jobqueue kvstore lease migrate-payments requeue retrystorm sktrace twophase webjobs; do
            echo "::group::examples/$m"
            (cd examples/$m && test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./... &&
              GOTOGETHER_EVIDENCE="$RUNNER_TEMP/evidence/$m" go test -exec "$RUNNER_TEMP/cputime" -short -count=1 -timeout 30m -skip '^(TestMutationOf|TestCodeCoverage)' ./...) || exit 1
            echo "::endgroup::"
          done
          # a package costing twice the CPU seconds it did (ci/test-times.txt) fails
          sort -k2,2nr "$RUNNER_TEMP/cpu.txt"
          ci/time-budget.sh < "$RUNNER_TEMP/cpu.txt"
          # what no faithful exploration of the example tried fails: an action, a fault point, a kind
          for m in hello checkout; do
            "$RUNNER_TEMP/gotogether" evidence -strict "$RUNNER_TEMP/evidence/$m" || exit 1
          done
      - name: the store's histories against its isolation levels (GOTOGETHER_CHECK)
        if: matrix.part == 'examples'
        run: for m in checkout twophase; do (cd examples/$m && GOTOGETHER_CHECK=1 go test -short -count=1 -skip '^(TestMutationOf|TestCodeCoverage)' ./...) || exit 1; done
      - name: example app demos
        if: matrix.part == 'demos'
        run: |
          examples/kvstore/run-demo.sh
          examples/jobqueue/run-demo.sh
          SEEDS=15 examples/checkout/run-demo.sh
          examples/twophase/run-demo.sh
          examples/hello/run-demo.sh
          examples/lease/run-demo.sh
          MUTANT=wallInterval CLOCKS=1 examples/lease/run-demo.sh && exit 1 || true
          MUTANT=noFencing DRIFT=0.25 examples/lease/run-demo.sh && exit 1 || true
          MUTANT=noDedupe examples/hello/run-demo.sh && exit 1 || true
          examples/requeue/run-demo.sh
          MUTANT=stampSpec examples/requeue/run-demo.sh && exit 1 || true
          MUTANT=giveUp examples/requeue/run-demo.sh && exit 1 || true
          examples/retrystorm/run-demo.sh
          examples/counters/run-demo.sh && MUTANT=blind examples/counters/run-demo.sh
          examples/migrate-payments/run-demo.sh
          MUTANT=forgetsPriorRefunds examples/migrate-payments/run-demo.sh && exit 1 || true

      - name: every model on its own (gotogether simulate)
        if: matrix.part == 'tools'
        run: |
          go build -o "$RUNNER_TEMP/gotogether" ./cmd/gotogether
          for b in $(git ls-files 'examples/*binding*.yaml' 'examples/**/*binding*.yaml' | sort -u); do
            "$RUNNER_TEMP/gotogether" simulate -binding "$b" || exit 1
          done
      - name: qanalysis (analyzers, static action map)
        if: matrix.part == 'tools'
        working-directory: qanalysis
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: quintvet on the core
        if: matrix.part == 'tools'
        run: |
          go build -C qanalysis -o "$RUNNER_TEMP/quintvet" ./cmd/quintvet
          "$RUNNER_TEMP/quintvet" -quintweave=false -quintctx=false ./...
          # quintctx on the core's code, its tests aside (a test's
          # context.Background() is often deliberate, and t.Context() ends
          # before its cleanups)
          "$RUNNER_TEMP/quintvet" -quintsim=false -quintweave=false -quintaction=false -test=false ./...
      - name: fuzzing the faithful shop (coverage-guided, the model judging every run)
        if: matrix.part == 'tools'
        working-directory: examples/checkout
        run: go test -run XXX -fuzz FuzzFaithful -fuzztime 60s .
      - name: mutation testing (hello woven by qweave -mutate; no survivors but the marked)
        if: matrix.part == 'tools'
        run: go run -C qweave ./cmd/qweave -C ../examples/hello -mutate -coverpkg github.com/chucklehead-dev/gotogether/examples/hello go test -count=1 -run TestMutationOfTheCounter -v .
      - name: code coverage by model step (checkout woven by qweave -cover)
        if: matrix.part == 'tools'
        run: go run -C qweave ./cmd/qweave -C ../examples/checkout -cover -coverpkg github.com/chucklehead-dev/gotogether/examples/checkout go test -count=1 -run TestCodeCoverage -v .

  workspace:
    # the published modules on the core as it is in this checkout (go.work),
    # not at the commit they pin: a change to the core that breaks qhegel,
    # qweave, qanalysis or qgosim fails here, before the bump
    runs-on: ubuntu-latest
    env:
      GOWORK: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: vet and test each published module in the workspace
        run: |
          for m in qhegel qweave qanalysis qgosim grist qnav qenv/simgrpc qenv/kubesim qenv/simlog/kafkalog qenv/simlog/kinesislog; do
            echo "::group::$m"
            (cd $m && go vet ./... && go test -short -count=1 -timeout 30m ./...) || exit 1
            echo "::endgroup::"
          done
          # qgosim has no tests of its own: its simulated side, vetted
          (cd qgosim && go vet -tags sim ./...)

  consumable:
    # what a user gets: the commands install at this commit, and a program
    # that records steps pulls in no Hegel
    runs-on: ubuntu-latest
    env:
      GOPROXY: direct
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - name: go install the commands at this commit
        run: |
          for c in cmd/gotogether qweave/cmd/qweave qanalysis/cmd/quintvet qnav/cmd/gotogether-nav; do
            go install github.com/chucklehead-dev/gotogether/$c@${{ github.sha }}
          done
      - name: a program that only records steps depends on no Hegel
        run: |
          mkdir user && cd user
          go mod init example.com/user
          printf 'package main\n\nimport "github.com/chucklehead-dev/gotogether/qobs"\n\nfunc main() { qobs.SetGlobal(nil) }\n' > main.go
          go get github.com/chucklehead-dev/gotogether@${{ github.sha }}
          go mod tidy && go build .
          if grep -E 'hegel|purego' go.mod go.sum; then echo "the core pulls in Hegel"; exit 1; fi

  consumer:
    # a user's module built from outside the repository (ci/consumer, an
    # order-sync service on simgrpc, simlog and kafkalog, explored with
    # qtest.System and qhegel): no replace, no workspace, the published
    # modules at this commit, so nothing builds only because the checkout
    # is beside it (ROADMAP I14). First with the core at the newest of the
    # modules' pins, what go get of them gives a user; then with the core
    # at this commit too
    runs-on: ubuntu-latest
    env:
      GOPROXY: direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: the consumer on the published modules at this commit, the core at their pins
        run: |
          cp -r ci/consumer "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          m=github.com/chucklehead-dev/gotogether
          go get $m/qenv/simgrpc@${{ github.sha }} $m/qenv/simlog/kafkalog@${{ github.sha }} $m/qhegel@${{ github.sha }}
          go mod tidy
          if grep -n '^replace' go.mod; then echo "the consumer must build without replace"; exit 1; fi
          go list -m all | grep "^$m"
          go vet ./... && go test -count=1 ./...
      - name: the consumer with the core at this commit too
        working-directory: ${{ runner.temp }}/consumer
        run: |
          go get github.com/chucklehead-dev/gotogether@${{ github.sha }}
          go mod tidy
          go list -m all | grep '^github.com/chucklehead-dev/gotogether'
          go vet ./... && go test -count=1 ./...

  doubles:
    # the published doubles whose dependencies the core does not take
    # (gRPC, client-go and controller-runtime, franz-go, the AWS SDK):
    # each a module of its own, tested on its own go.mod and pinned core,
    # with the scheduler's and the doubles' self-checks on
    strategy:
      fail-fast: false
      matrix:
        module: [qenv/simgrpc, qenv/kubesim, qenv/simlog/kafkalog, qenv/simlog/kinesislog]
    name: doubles (${{ matrix.module }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt, vet
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
      - name: test (GOTOGETHER_CHECK, and under the race detector)
        run: |
          GOTOGETHER_CHECK=1 go test -count=1 ./...
          go test -race -count=1 ./...

  edgepublish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/edgepublish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/edgepublish/go.mod
          cache-dependency-path: examples/edgepublish/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: vet
        run: go vet ./...
      - name: test (unwoven)
        # its scenarios record nothing unwoven and skip by right
        # (SkipIfEmpty): strict mode is for the woven run below
        env:
          GOTOGETHER_STRICT: ""
        run: go test -count=1 -timeout 30m ./...
      - name: test (woven with Orchestrion)
        run: go run github.com/DataDog/orchestrion go test -timeout 30m -count=1 ./mbt/ ./scenarios/
      - name: the publisher in a simulation (qenv/weave's aspects, woven by qweave)
        run: go run -C ../../qweave ./cmd/qweave -C "$PWD" go test -short -timeout 20m -count=1 ./sim/
      - name: what weaving cannot rewrite
        run: (cd ../.. && go run ./cmd/gotogether lint -weave examples/edgepublish/publisher)
      - name: demo
        run: OUT=$RUNNER_TEMP/demo ./run-demo.sh

  qweave:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qweave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: qweave/go.mod
          cache-dependency-path: qweave/go.sum
      - name: vet
        run: go vet ./...
      - name: test (aspects woven, the woven fixture run in qenv)
        run: go test -count=1 ./...

  qnav:
    # the interactive navigator, a module of its own (Charm's libraries):
    # its screens driven by key messages, hello's run through a session of
    # its test binary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qnav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: qnav/go.mod
          cache-dependency-path: qnav/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../ci/install-quint.sh
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./internal/... ./cmd/...

  qnav-tapes:
    # the navigator's VHS tapes in a real terminal (vhs drives ttyd in a
    # headless browser, ffmpeg encodes): their text against the goldens,
    # and the rendered GIFs and screenshots as an artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qnav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: qnav/go.mod
          cache-dependency-path: qnav/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../ci/install-quint.sh
      - name: Install vhs, ttyd and ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ttyd ffmpeg
          go install github.com/charmbracelet/vhs@v0.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: "the tapes: their screens against the goldens"
        run: go test -count=1 -run TestTapes -v ./tapes/
      - name: render the tapes
        run: tapes/render.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gotogether-nav-media
          path: qnav/tapes/media

  gosim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/gosim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/gosim/go.mod
          cache-dependency-path: examples/gosim/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: vet
        run: go vet ./... && go vet -tags sim ./broadcast/cluster/ ./checkout/ && (cd ../../qgosim && go vet ./... && go vet -tags sim ./...)
      - name: test (broadcast and checkout on gosim, choices from qenv)
        run: go test -p 1 -short -count=1 -timeout 30m ./...

  quorumkv:
    # its own job: its mutants' explorations are linearized, each candidate
    # order a quint replay, about twenty minutes in all
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/quorumkv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/quorumkv/go.mod
          cache-dependency-path: examples/quorumkv/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./...
      - name: test (liveness, pending calls, linearized per key, PCT)
        run: |
          go build -C ../.. -o "$RUNNER_TEMP/cputime" ./internal/cputime
          GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/cpu.txt" go test -exec "$RUNNER_TEMP/cputime" -short -count=1 -timeout 45m ./...
          sort -k2,2nr "$RUNNER_TEMP/cpu.txt"
          ../../ci/time-budget.sh < "$RUNNER_TEMP/cpu.txt"

  raftkv:
    # its own job: etcd's raft library on qenv, histories linearized whole
    # and searched exhaustively over clock drifts, about six minutes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/raftkv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/raftkv/go.mod
          cache-dependency-path: examples/raftkv/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet, lint -sim
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./... && go run -C ../.. ./cmd/gotogether lint -sim examples/raftkv
      - name: test (linearized whole, pending calls, leadership within a bound, clock drift, rolling upgrades)
        run: |
          go build -C ../.. -o "$RUNNER_TEMP/cputime" ./internal/cputime
          GOTOGETHER_CHECK=1 GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/cpu.txt" go test -exec "$RUNNER_TEMP/cputime" -short -count=1 -timeout 45m ./...
          sort -k2,2nr "$RUNNER_TEMP/cpu.txt"
          ../../ci/time-budget.sh < "$RUNNER_TEMP/cpu.txt"

  raftkv-real:
    # raftkv's real tier: three raftkv-node processes on localhost under
    # qnemesis (crashes, pauses, isolated nodes through toxiproxy, lost
    # client responses, every node cut off), judged by the simulation's
    # bindings; built and run with the race detector, about four minutes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/raftkv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/raftkv/go.mod
          cache-dependency-path: examples/raftkv/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: Install toxiproxy-server
        run: |
          go install github.com/Shopify/toxiproxy/v2/cmd/server@v2.12.0
          mv "$(go env GOPATH)/bin/server" "$(go env GOPATH)/bin/toxiproxy-server"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: real runs (seeds 5, 9, 10 faithful, NoRequestID and SlowElection; their journals re-made in the simulation; a kill -9 and restart)
        run: RAFTKV_REAL=1 RAFTKV_REAL_DIR="$RUNNER_TEMP/real" go test -race -count=1 -timeout 12m -run 'TestReal' -v .
      - name: keep the runs' logs and journals
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raftkv-real
          path: ${{ runner.temp }}/real

  wallet:
    # its own job: linearized explorations and resolved pending calls,
    # under the store's own history check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/wallet/go.mod
          cache-dependency-path: examples/wallet/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet, lint -sim
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./... && go run -C ../.. ./cmd/gotogether lint -sim examples/wallet
      - name: test (Exhaust, isolation levels and qhistory, linearized, pending calls, every fault family)
        run: |
          go build -C ../.. -o "$RUNNER_TEMP/cputime" ./internal/cputime
          GOTOGETHER_CHECK=1 GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/cpu.txt" go test -exec "$RUNNER_TEMP/cputime" -short -count=1 -timeout 45m ./...
          sort -k2,2nr "$RUNNER_TEMP/cpu.txt"
          ../../ci/time-budget.sh < "$RUNNER_TEMP/cpu.txt"
      - name: demos
        run: ./run-demo.sh && MUTANT=writeSkew ./run-demo.sh

  grist:
    # its own module (published like qhegel): the framework's stores
    # against the contract suite (PostgreSQL 16 among them, a service
    # container: GRIST_POSTGRES), its commands and processors on a
    # simulated store, the scheduler's and the Store's checks on, and
    # grist.qnt checked by quint (model/model_test.go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      GRIST_POSTGRES: "host=localhost port=5432 user=postgres password=postgres dbname=postgres sslmode=disable"
    defaults:
      run:
        working-directory: grist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: grist/go.mod
          cache-dependency-path: grist/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../ci/install-quint.sh
      - name: gofmt, vet, lint -sim
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./... && go run -C .. ./cmd/gotogether lint -sim grist
      - name: test (GOTOGETHER_CHECK, quint required)
        run: GOTOGETHER_CHECK=1 GOTOGETHER_STRICT=1 go test -count=1 -timeout 30m ./...

  payd:
    # its own job: an unmodified net/http + database/sql service in qenv
    # through qsql and qhttp, its mutants built as go test -overlay
    # binaries, and the same service on SQLite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/payd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/payd/go.mod
          cache-dependency-path: examples/payd/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet, lint -sim
        run: test -z "$(gofmt -l . | tee /dev/stderr)" && go vet ./... && go run -C ../.. ./cmd/gotogether lint -sim examples/payd
      - name: test (three isolation levels, Exhaust within one fault, mutants as overlays, SQLite)
        run: |
          go build -C ../.. -o "$RUNNER_TEMP/cputime" ./internal/cputime
          GOTOGETHER_CHECK=1 GOTOGETHER_CPU_TIMES="$RUNNER_TEMP/cpu.txt" go test -exec "$RUNNER_TEMP/cputime" -short -count=1 -timeout 30m ./...
          sort -k2,2nr "$RUNNER_TEMP/cpu.txt"
          ../../ci/time-budget.sh < "$RUNNER_TEMP/cpu.txt"
      - name: demos
        run: ./run-demo.sh && MUTANT=precheck ./run-demo.sh

  maelstrom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install quint and gnuplot
        run: |
          ci/install-quint.sh
          sudo apt-get update -q && sudo apt-get install -y gnuplot-nox
      - name: Gossip Glomers under Maelstrom, step logs checked by gotogether
        run: OUT=$RUNNER_TEMP/maelstrom examples/glomers/maelstrom.sh
      - name: Maelstrom's stores (results.edn, jepsen.log, history)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maelstrom-store
          path: ${{ runner.temp }}/maelstrom/store
          retention-days: 14

  fleetrollout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/fleetrollout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/fleetrollout/go.mod
          cache-dependency-path: examples/fleetrollout/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint and kwok
        run: |
          ../../ci/install-quint.sh
          go install sigs.k8s.io/kwok/cmd/kwokctl@v0.7.0 sigs.k8s.io/kwok/cmd/kwok@v0.7.0
      - name: vet
        run: go vet ./...
      - name: test (simulated fleet)
        run: go test -short -count=1 -timeout 30m ./...
      - name: the real controller on three kwok clusters
        run: |
          # each run's exit status is its verdict: 0 conforms, 1 violation
          KEEP=1 ./kwok-demo.sh
          KEEP=1 KILL=1 ./kwok-demo.sh
          if KEEP=1 MUTANT=ignoreObservedGeneration ./kwok-demo.sh; then echo "mutant passed"; exit 1; fi
          if KILL=1 MUTANT=inMemoryProgress ./kwok-demo.sh; then echo "mutant passed"; exit 1; fi
          # pods timed by a production trace (kwok Stages from its lifetimes), on clusters of their own
          TRACE=../sktrace/testdata/cronjob.sktrace KEEP=1 ./kwok-demo.sh
          if TRACE=../sktrace/testdata/cronjob.sktrace MUTANT=ignoreObservedGeneration ./kwok-demo.sh; then echo "mutant passed"; exit 1; fi

  crossdb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/crossdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/crossdb/go.mod
          cache-dependency-path: examples/crossdb/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
      - name: Install quint and kind
        run: |
          ../../ci/install-quint.sh
          go install sigs.k8s.io/kind@v0.30.0
      - name: vet
        run: go vet ./...
      - name: test (simulated provider, cloud and cluster)
        run: go test -short -count=1 -timeout 30m ./...
      - name: the provider on kind with Crossplane
        run: |
          # each run's exit status is its verdict: 0 conforms, 1 violation
          DROP=0.1 kind/demo.sh
          KILL=1 kind/demo.sh
          if MUTANT=noClientToken DROP=0.3 N=6 kind/demo.sh; then echo "mutant passed"; exit 1; fi

  grpcledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/grpcledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/grpcledger/go.mod
          cache-dependency-path: examples/grpcledger/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet, simulation lint
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go run -C ../.. ./cmd/gotogether lint -sim examples/grpcledger
      - name: test (simulated through simgrpc, and a real grpc.Server)
        run: |
          go test -short -count=1 -timeout 30m ./...
          go test -race -short -count=1 ./...
          GOTOGETHER_CHECK=1 go test -short -count=1 ./...
      - name: demo (real server, otelgrpc spans converted and validated)
        run: |
          ./run-demo.sh
          if MUTANT=noDedupe ./run-demo.sh; then echo "mutant passed"; exit 1; fi

  streams:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/streams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/streams/go.mod
          cache-dependency-path: examples/streams/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: gofmt, vet, simulation lint
        run: |
          test -z "$(gofmt -l . | tee /dev/stderr)"
          go vet ./...
          go run -C ../.. ./cmd/gotogether lint -sim examples/streams
      - name: test (simulated log with GOTOGETHER_CHECK, Kafka on kfake, Kinesis on a fake endpoint)
        run: |
          GOTOGETHER_CHECK=1 go test -short -count=1 ./...
          go test -race -short -count=1 ./tier/
          go test -short -count=1 -timeout 30m ./...
      - name: fuzzing the faithful pipeline
        run: go test -run '^$' -fuzz FuzzFaithful -fuzztime 30s .
      - name: demo
        run: ./run-demo.sh
