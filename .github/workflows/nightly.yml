name: nightly

# CI re-checks the same seeds on every push; this widens the sample each
# night: fresh seeds (an offset by date), more of them, and longer fuzzing.
# A failure's report names its run (GOTOGETHER_RUN=... replays it) or its
# fuzz input (testdata/fuzz), and its run is kept as a corpus entry (the
# artifact): commit it as a regression once fixed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUINT_VERSION: 0.33.0
  GOWORK: "off"
  GOTOGETHER_SEEDS: "500"
  # Hegel searches at a fresh seed, logged (GOTOGETHER_HEGEL_SEED=<it>
  # replays one)
  GOTOGETHER_HEGEL_SEED: random

jobs:
  fresh-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        example: [bank, checkout, glomers, hello, jobqueue, kvstore, lease, retrystorm, twophase, crossdb, grpcledger, streams, wallet, quorumkv, raftkv, fleetrollout, payd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: explorations at fresh seeds
        working-directory: examples/${{ matrix.example }}
        run: |
          export GOTOGETHER_SEED_OFFSET=$(( $(date -u +%s) / 86400 * 1000 ))
          echo "seeds $((GOTOGETHER_SEED_OFFSET + 1))..$((GOTOGETHER_SEED_OFFSET + GOTOGETHER_SEEDS))"
          GOTOGETHER_CORPUS=$RUNNER_TEMP/corpus go test -count=1 -timeout 280m ./...
      - name: keep the failing runs (each a corpus entry; commit under a test's ExploreConfig.Corpus)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.example }}
          path: ${{ runner.temp }}/corpus

  core-properties:
    # the core's Hegel properties (internal/hegelprops) at a fresh Hegel seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the core's Hegel properties at a fresh seed
        working-directory: internal/hegelprops
        run: GOTOGETHER_CHECK=1 go test -count=1 -timeout 50m ./...

  volume:
    # validation at production volume (I19): a serial log of 10^5 steps
    # judged by entity under a time budget (every push runs 10^4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: 10^5 steps partitioned
        run: GOTOGETHER_SCALE_STEPS=100000 go test -count=1 -run '^TestPartitionAtVolume$' -v ./validate

  core-mutants:
    # the toolkit's own mutation testing: each core package's unit tests run
    # once per woven mutant; survivors are code they do not constrain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # max: the survivors allowed, each one read and equivalent
        # (internal/depgraph: sorting the nodes Tarjan visits, whose
        # components are sorted after)
        include:
          # qtrace: 24 of 405, each read (ids as of the watermarks' and the
          # observation mutants' tests). Equivalent: realTime's loop bounds
          # (47, 49, 52: earliest[0] is never read, earliest[k] >= k); a seq
          # equal to a Call or to another step's of its recorder (61, 67, 279:
          # that record is never among the steps, seqs are deduplicated, and a
          # completion numbered as its invocation is that record's duplicate);
          # a rejected order's state (93: never read); a budget's last turn
          # (101, 129, 130: it checks nothing); a complete search that tried
          # nothing (126: needs a budget under 1, which Linearize never
          # passes); a move to the front of what is first (77, 110: nothing to
          # move); the comparator's < on values never equal (295, 296); the
          # time key left in a line's attributes (37: nothing reads it); the
          # assumed mark inverted for every step alike (44: the same groups of
          # equal keys); a recorder's first seq against an equal one (235: seqs
          # are deduplicated first); a merged loss's After set to the equal
          # value it has (249, 250); UncorruptedFields' two passes in the other
          # order (198: the same fields); a retime's tie with its own copy (208:
          # what the retime of either would break, wellFormed leaves out) and a
          # step moved past itself (215: the others are other actors'). 119
          # ties the guided search's best move otherwise: another path, the
          # same verdicts.
          - pkg: qtrace
            max: 24
          # qenv: 22 of 914, each read. Two need gosim's cooperative
          # runtime, which only its module runs: a release dropped on a
          # Platform (572: enqueue, 341: a task that crashes its own
          # process). Equivalent: the history checker's rotation of a cycle
          # that starts at its closer (22, 23); the profile key's separator
          # (27: pcs and names never collide); a nominal option's name, ""
          # either way (102); PCT's depth 1 set to 1 (158); sorts of what
          # is handled one at a time (193: a disk's files, 837: a crashed
          # process's transactions); a stopped timer nothing reads (305);
          # bookkeeping kept past use (363, 904); IDs a queue never repeats
          # (401); a Notify that wakes no one (433, 442); a step count never
          # below 0 (470); a finished task never queued (548); stale timer
          # entries popped elsewhere (711, 729); bounds a case before
          # already decides (722: the run queue's k-th past its end is an
          # id above every task's; 725: pos == k returned first); the
          # watchdog's last task left after Run (789: Run returns only when
          # every task handed back, and a parked task is skipped).
          - pkg: qenv
            max: 22
          - pkg: qhistory
            max: 0
          - pkg: internal/depgraph
            max: 1
          - pkg: qsweep
            max: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: mutants of ${{ matrix.pkg }}
        env:
          JOBS: 4 # qenv's 892 mutants, about ten seconds each
        run: ci/mutate-core.sh ${{ matrix.pkg }} ${{ matrix.max }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: examples/checkout
          - dir: examples/streams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: fuzz for half an hour
        working-directory: ${{ matrix.dir }}
        run: go test -run '^$' -fuzz FuzzFaithful -fuzztime 30m .
      - name: keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/testdata/fuzz

  qeval-differential:
    # the Go evaluator against quint's two backends on generated
    # expressions and actions (internal/qeval's TestDifferentialAgainstQuint,
    # ROADMAP I11): each batch a module of 200 well-typed random vals and
    # actions over the builtins the evaluator supports, judged by the
    # evaluator and by `quint test` on rust and typescript. A difference
    # where the evaluator answered is a bug, shrunk and named by its batch
    # (GOTOGETHER_QEVAL_FUZZ_SEED=n reruns it). The push tier runs batches 1
    # and 2 of 100 entries; this one 80 of 200 (16000 entries) at seeds
    # offset by date, about 70 CPU s a batch.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: generated expressions, judged by the evaluator and both backends
        env:
          GOTOGETHER_QEVAL_FUZZ: "80"
          GOTOGETHER_QEVAL_FUZZ_SIZE: "200"
          GOTOGETHER_KEEP: ${{ runner.temp }}/qeval
        run: |
          export GOTOGETHER_SEED_OFFSET=$(( $(date -u +%s) / 86400 * 1000 ))
          echo "batches $((GOTOGETHER_SEED_OFFSET + 1))..$((GOTOGETHER_SEED_OFFSET + GOTOGETHER_QEVAL_FUZZ))"
          mkdir -p "$GOTOGETHER_KEEP"
          set -o pipefail
          go test -count=1 -timeout 110m -run '^TestDifferential' -v ./internal/qeval | tee "$GOTOGETHER_KEEP/differential.log"
      - name: keep the batches (each one's module, quint's IR and both backends' reports) and the log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qeval-differential
          path: ${{ runner.temp }}/qeval

  # Every model on its own, every trace of up to 8 steps (quint verify,
  # Apalache): a bounded proof of what the binding says each invariant
  # holds, a counterexample for what it allows. A binding's
  # simulate.verifySteps caps the depth for its model, and verifySkip
  # leaves a model out with the reason (grpcledger, twophase); their
  # sampling in CI stands.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install quint
        run: ci/install-quint.sh
      - name: quint verify on every binding
        run: |
          go build -o "$RUNNER_TEMP/gotogether" ./cmd/gotogether
          GOTOGETHER_VERIFY=1 go test -count=1 -run TestSimulateVerify ./cmd/gotogether
          for b in $(git ls-files 'examples/*binding*.yaml' 'examples/**/*binding*.yaml' | sort -u); do
            "$RUNNER_TEMP/gotogether" simulate -binding "$b" -verify 8 || exit 1
          done

  evaluator-shadow:
    # the Go evaluator against quint (GOTOGETHER_EVAL=shadow) on every
    # batch a search judges and on each actor of every run checked, in
    # every example: a disagreement fails the test, naming the candidate.
    # Quint checks everything too, so it takes what quint alone does, and
    # more: a search's every candidate batch goes to quint as well. It
    # guards the evaluator's passes, which decide every run outside shadow
    # (validate/decide.go): each run's plan is judged by the evaluator as
    # a check judges it, and by quint, and a verdict, a passing result or
    # an ITF state they differ on is the run's error, and so are a passing
    # run's bounded responses (within: webjobs, raftkv) judged on each
    # one's states otherwise (verdict, failing step, note). The log
    # (GOTOGETHER_SHADOW_LOG) counts the runs compared and refused.
    #
    # seeds: the explorations' count where 500 would not fit 110m, each
    # measured in shadow on 4 cores (nightly 6, and nights 4 and 5, timed
    # out at 110m with 500 in all four below). own: the tests' own counts
    # (the workflow's GOTOGETHER_SEEDS unset), the searches' cost being their
    # candidates', not their runs'.
    # - fleetrollout: nine explorations, at 500 seeds 4500 runs at the
    #   1.0 s a run takes CI's -short tier (49 s for 48), more with both
    #   evaluators; 150 (about 35 minutes) exceed every test's own count.
    # - quorumkv: 100 seeds 21 minutes (TestRepick 8), above its own 70.
    # - streams: 100 seeds 14 minutes (TestMutants' four in parallel, 9),
    #   above its own 60.
    # - wallet: own, 28 minutes (TestPendingTransfersLinearized 20; at 100
    #   seeds its first exploration alone took 43), and the core's searches
    #   after it, 27.
    # - counters, wallet-grist, library, webjobs: own (added with the
    #   evaluator deciding passes, the runs it decides most of).
    # - raftkv: own, in two shards: TestLostSnapshots 40 minutes; the rest
    #   about 52 (TestPendingTransfers 23, TestRollingUpgrade 19). Not
    #   TestLinearizeScale: its five 200-operation histories took more
    #   than 90 minutes in shadow, the search's tens of thousands of
    #   candidates each judged by quint too; raftkv's other tests shadow
    #   the same linearized checks, and fresh-seeds runs it.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        example: [bank, checkout, glomers, hello, jobqueue, kvstore, lease, retrystorm, twophase, crossdb, grpcledger, streams, fleetrollout, edgepublish, quorumkv, wallet, payd, counters, wallet-grist, library, webjobs]
        include:
          - example: fleetrollout
            seeds: "150"
          - example: quorumkv
            seeds: "100"
          - example: streams
            seeds: "100"
          - example: wallet
            seeds: own
          # the grist examples: own, their suites' cost being quint's
          # detail replays and real-tier runs, not seeds
          - example: counters
            seeds: own
          - example: wallet-grist
            seeds: own
          - example: library
            seeds: own
          - example: webjobs
            seeds: own
          - example: raftkv
            shard: lost-snapshots
            seeds: own
            run: ^TestLostSnapshots$
          - example: raftkv
            shard: rest
            seeds: own
            skip: ^(TestLostSnapshots|TestLinearizeScale)$
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: the tests, every judgement checked by both
        working-directory: examples/${{ matrix.example }}
        env:
          SEEDS: ${{ matrix.seeds || '500' }}
          RUN: ${{ matrix.run }}
          SKIP: ${{ matrix.skip }}
        run: |
          if [ "$SEEDS" = own ]; then unset GOTOGETHER_SEEDS; else export GOTOGETHER_SEEDS=$SEEDS; fi
          export GOTOGETHER_SHADOW_LOG="$RUNNER_TEMP/shadow.log"
          GOTOGETHER_EVAL=shadow go test -count=1 -timeout 110m ${RUN:+-run "$RUN"} ${SKIP:+-skip "$SKIP"} ./...
      - name: the core's searches, checked by both
        if: matrix.example == 'wallet'
        env:
          GOTOGETHER_SHADOW_LOG: ${{ runner.temp }}/shadow.log
        run: GOTOGETHER_EVAL=shadow go test -count=1 -timeout 60m ./validate ./qtest
      - name: the runs compared
        if: always()
        run: |
          log="$RUNNER_TEMP/shadow.log"
          touch "$log"
          echo "runs judged by both: $(grep -c '^agree ' "$log") agreed, $(grep -c '^DISAGREE ' "$log") disagreed; refused by the evaluator (quint's alone): $(grep -c '^refused ' "$log")"
          grep '^refused ' "$log" | cut -d' ' -f2 | sort | uniq -c || true
          if grep '^DISAGREE ' "$log"; then echo "::error::the Go evaluator and quint disagree (above): the evaluator decides passing runs outside shadow"; exit 1; fi

  webjobs-live:
    # webjobs explored live by Bombadil (headless, ubuntu's Chrome): the
    # faithful app for 45s (a finished journey, its manifest replayed,
    # then --reproduce), and each mutant's server for 45s (its invariant
    # violated); a Playwright journey through adapters/playwright. Strict:
    # a bombadil (or playwright) missing from PATH fails the job
    # instead of skipping. The per-push tier checks the recorded runs
    # (testdata/runs) in the examples loop.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOGETHER_STRICT: "1"
    defaults:
      run:
        working-directory: examples/webjobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/webjobs/go.mod
          cache-dependency-path: examples/webjobs/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: Install Bombadil (pinned)
        run: |
          npm i -g @antithesishq/bombadil@0.7.9
          bombadil --version
          google-chrome --version
      - name: live journeys
        run: WEBJOBS_JOURNEYS="$RUNNER_TEMP/journeys" go test -count=1 -timeout 25m -run 'TestLive$|TestMutants$' -v .
      - name: each mutant's failure shrunk (TestShrink, TestShrinkRecorded)
        run: go test -count=1 -timeout 30m -run 'TestShrink$|TestShrinkRecorded$' -v .
      - name: "the recorded journey's observation mutants (full mode only, a check per mutant)"
        run: go test -count=1 -timeout 15m -run 'TestObservationMutants$' -v .
      - name: Install Playwright (pinned) and its Chromium
        run: |
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: "a Playwright journey, through adapters/playwright's request log (TestPlaywright)"
        run: go test -count=1 -timeout 10m -run 'TestPlaywright$' -v .
      - name: keep the journeys (Bombadil's traces and screenshots, the server's logs, run-info.json)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webjobs-journeys
          path: ${{ runner.temp }}/journeys

  raftkv-real:
    # raftkv's real tier under qnemesis at fresh seeds (schedules), more
    # runs: 10 faithful, 5 each of NoRequestID and SlowElection, with the
    # race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/raftkv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/raftkv/go.mod
          cache-dependency-path: examples/raftkv/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ../../ci/install-quint.sh
      - name: Install toxiproxy-server
        run: |
          go install github.com/Shopify/toxiproxy/v2/cmd/server@v2.12.0
          mv "$(go env GOPATH)/bin/server" "$(go env GOPATH)/bin/toxiproxy-server"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: real runs at fresh seeds
        run: |
          export GOTOGETHER_SEED_OFFSET=$(( $(date -u +%s) / 86400 * 1000 ))
          echo "seeds $((GOTOGETHER_SEED_OFFSET + 1))..."
          RAFTKV_REAL=1 RAFTKV_REAL_RUNS=10 RAFTKV_REAL_MUTANT_RUNS=5 RAFTKV_REAL_DIR="$RUNNER_TEMP/real" \
            go test -race -count=1 -timeout 25m -run 'TestRealNemesis|TestRealNoRequestID|TestRealSlowElection' -v .
      - name: keep the runs' logs and journals (a faithful failure's log names its replay in the simulation)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raftkv-real
          path: ${{ runner.temp }}/real

  benchmarks:
    # the core's benchmarks (every root-module package with one) at HEAD
    # against the commit main was at a day before, both measured here,
    # interleaved (ci/bench.sh): a significant regression (p < 0.05) past
    # 25% in sec/op, or 10% in B/op or allocs/op, fails the night. The
    # runs and benchstat's table are the artifact. A night's regression,
    # if kept, is the next night's base: fix it or say why in its commit.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Install quint
        # qeval's benchmarks compile their models with it (they skip without)
        run: ci/install-quint.sh
      - name: the benchmarks, against a day before
        run: |
          base=$(git rev-list -1 --before="24 hours ago" HEAD)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "no commit in the last day: nothing to compare"
            exit 0
          fi
          echo "base $base ($(git log -1 --format=%cd "$base"))"
          ci/bench.sh run "$base" "$RUNNER_TEMP/bench"
      - name: regressions
        run: |
          [ -f "$RUNNER_TEMP/bench/compare.csv" ] || exit 0
          ci/bench.sh check "$RUNNER_TEMP/bench/compare.csv"
      - name: keep the runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            ${{ runner.temp }}/bench/*.txt
            ${{ runner.temp }}/bench/compare.csv
          if-no-files-found: ignore
