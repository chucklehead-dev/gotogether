name: nightly

# CI re-checks the same seeds on every push; this widens the sample each
# night: fresh seeds (an offset by date), more of them, and longer fuzzing.
# A failure's report names its run (GOTOGETHER_RUN=... replays it) or its
# fuzz input (testdata/fuzz), and its run is kept as a corpus entry (the
# artifact): commit it as a regression once fixed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  QUINT_VERSION: 0.33.0
  GOWORK: "off"
  GOTOGETHER_SEEDS: "500"
  # Hegel searches at a fresh seed, logged (GOTOGETHER_HEGEL_SEED=<it>
  # replays one)
  GOTOGETHER_HEGEL_SEED: random

jobs:
  fresh-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        example: [bank, checkout, glomers, hello, jobqueue, kvstore, lease, retrystorm, twophase, crossdb, grpcledger, streams, wallet, quorumkv, raftkv, fleetrollout]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: explorations at fresh seeds
        working-directory: examples/${{ matrix.example }}
        run: |
          export GOTOGETHER_SEED_OFFSET=$(( $(date -u +%s) / 86400 * 1000 ))
          echo "seeds $((GOTOGETHER_SEED_OFFSET + 1))..$((GOTOGETHER_SEED_OFFSET + GOTOGETHER_SEEDS))"
          GOTOGETHER_CORPUS=$RUNNER_TEMP/corpus go test -count=1 -timeout 280m ./...
      - name: keep the failing runs (each a corpus entry; commit under a test's ExploreConfig.Corpus)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ matrix.example }}
          path: ${{ runner.temp }}/corpus

  core-properties:
    # the core's Hegel properties (internal/hegelprops) at a fresh Hegel seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the core's Hegel properties at a fresh seed
        working-directory: internal/hegelprops
        run: GOTOGETHER_CHECK=1 go test -count=1 -timeout 50m ./...

  core-mutants:
    # the toolkit's own mutation testing: each core package's unit tests run
    # once per woven mutant; survivors are code they do not constrain
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # max: the survivors allowed, each one read and equivalent
        # (internal/depgraph: sorting the nodes Tarjan visits, whose
        # components are sorted after)
        include:
          # qtrace: 16 of 236, each read. Equivalent: realTime's loop bounds
          # (33, 35, 38: earliest[0] is never read, earliest[k] >= k); a seq
          # equal to a Call or a pending call's own (47, 53: that record is
          # never among the steps); a rejected order's state (77: never
          # read); a budget's last turn (85, 110, 113, 114: it checks
          # nothing); a reorder at the first step (94: nothing to move);
          # the comparator's < on values never equal (151, 152); the time
          # key left in a line's attributes (27: nothing reads it); the
          # assumed mark inverted for every step alike (30: the same groups
          # of equal keys). 103 ties the guided search's best move
          # otherwise: another path, the same verdicts.
          - pkg: qtrace
            max: 16
          # qenv: 21 of 892, each read. Two need gosim's cooperative
          # runtime, which only its module runs: a release dropped on a
          # Platform (568: enqueue, 341: a task that crashes its own
          # process). Equivalent: the history checker's rotation of a cycle
          # that starts at its closer (22, 23); the profile key's separator
          # (27: pcs and names never collide); a nominal option's name, ""
          # either way (102); PCT's depth 1 set to 1 (158); sorts of what
          # is handled one at a time (193: a disk's files, 815: a crashed
          # process's transactions); a stopped timer nothing reads (305);
          # bookkeeping kept past use (363, 882); IDs a queue never repeats
          # (401); a Notify that wakes no one (433, 442); a step count never
          # below 0 (470); a finished task never queued (546); stale timer
          # entries popped elsewhere (704, 722); bounds a case before
          # already decides (715, 718).
          - pkg: qenv
            max: 21
          - pkg: qhistory
            max: 0
          - pkg: internal/depgraph
            max: 1
          - pkg: qsweep
            max: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: mutants of ${{ matrix.pkg }}
        env:
          JOBS: 4 # qenv's 892 mutants, about ten seconds each
        run: ci/mutate-core.sh ${{ matrix.pkg }} ${{ matrix.max }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: examples/checkout
          - dir: examples/streams
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: fuzz for half an hour
        working-directory: ${{ matrix.dir }}
        run: go test -run '^$' -fuzz FuzzFaithful -fuzztime 30m .
      - name: keep what it found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: ${{ matrix.dir }}/testdata/fuzz

  # Every model on its own, every trace of up to 8 steps (quint verify,
  # Apalache): a bounded proof of what the binding says each invariant
  # holds, a counterexample for what it allows. A binding's
  # simulate.verifySteps caps the depth for its model, and verifySkip
  # leaves a model out with the reason (grpcledger, twophase); their
  # sampling in CI stands.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install quint
        run: ci/install-quint.sh
      - name: quint verify on every binding
        run: |
          go build -o "$RUNNER_TEMP/gotogether" ./cmd/gotogether
          GOTOGETHER_VERIFY=1 go test -count=1 -run TestSimulateVerify ./cmd/gotogether
          for b in $(git ls-files 'examples/*binding*.yaml' 'examples/**/*binding*.yaml' | sort -u); do
            "$RUNNER_TEMP/gotogether" simulate -binding "$b" -verify 8 || exit 1
          done

  evaluator-shadow:
    # the Go evaluator against quint (GOTOGETHER_EVAL=shadow) on every
    # batch a search judges and on each actor of every run checked, in
    # every example: a disagreement fails the test, naming the candidate.
    # Quint checks everything too, so it takes what quint alone does, and
    # more.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        example: [bank, checkout, glomers, hello, jobqueue, kvstore, lease, retrystorm, twophase, crossdb, grpcledger, streams, fleetrollout, edgepublish, quorumkv, raftkv, wallet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install quint
        run: ci/install-quint.sh
      - name: the tests, every judgement checked by both
        working-directory: examples/${{ matrix.example }}
        run: GOTOGETHER_EVAL=shadow go test -count=1 -timeout 110m ./...
      - name: the core's searches, checked by both
        if: matrix.example == 'wallet'
        run: GOTOGETHER_EVAL=shadow go test -count=1 -timeout 60m ./validate ./qtest
