# The lock's grants and the store's accepted writes as calls of
# model/lease.qnt. Both take the step's h and e (the defaults); a write
# the store refused as stale is no step of the model.
spec: model/lease.qnt
module: lease

constants:
  HOLDERS: '{{ set "h" }}'

actions:
  grant: {}
  write:
    outcomes:
      stale: skip

invariants: [noStaleWrite]

# The model on its own (gotogether simulate): noStaleWrite is the
# requirement on the code, which the model lets a store without fencing
# break.
simulate:
  constants: {HOLDERS: 'Set("a", "b")'}
  steps: 12
  allows: [noStaleWrite]
