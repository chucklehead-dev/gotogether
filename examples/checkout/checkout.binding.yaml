# Recorded checkout steps as calls of model/checkout.qnt. Steps are
# recorded at the commits where they take effect (Txn.OnCommit), in the
# shop's database or the provider's; every parameter is the step field of
# its name. Placing, refusing and cancelling compare the stock they leave
# with the model's: without it, a cancellation that forgot to restock went
# unseen (a mutant that every exploration survived). A refusal is a step
# so that the stock check is constrained both ways: a shop that refused an
# order it could fill recorded nothing before.
spec: model/checkout.qnt
module: checkout
constants:
  STOCK: '2'
actions:
  place:
    expect: 'stock == {{.obs.stock}}'
  refuse:
    expect: 'stock == {{.obs.stock}}'
  charge: {}
  refund: {}
  markPaid: {}
  ship: {}
  cancel:
    expect: 'stock == {{.obs.stock}}'
  settle: {}
invariants: [chargedAtMostOnce, settledCorrectly]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  holds: [settledCorrectly]
  allows: [chargedAtMostOnce]
