# Recorded kvstore steps (kv/store.go's qobs.Record calls, or the server's
# spans converted by kv.convert.yaml) as calls of model/kv.qnt.
spec: model/kv.qnt
module: kv

# Keys and values: those the run used.
constants:
  KEYS: '{{ set "key" }}'
  VALUES: '{{ set "value" }}'

# The store's errors classify themselves (QuintOutcome): conflict, missing.
outcomes:
  ok: Ok
  conflict: Conflict
  missing: Missing

actions:
  write:
    expect: 'revision == {{.obs.revision}}'
  cas:
    args: { o: '{{.outcome}}' }
    expect: 'revision == {{.obs.revision}}'
  del:
    args: { o: '{{.outcome}}' }
    expect: 'revision == {{.obs.revision}}'
  read:
    # What the read returned must be what the model's store holds.
    expect: >-
      revision == {{.obs.revision}} and
      (if ({{.obs.found}}) store.get({{.key}}) == { value: {{.obs.value}}, version: {{.obs.version}} }
       else not(store.keys().contains({{.key}})))

invariants: [versionsAreRevisions, versionsUnique]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  constants: {KEYS: 'Set("a", "b")', VALUES: 'Set("x", "y")'}
  holds: [versionsAreRevisions, versionsUnique]
