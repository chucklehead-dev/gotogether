# Generated by grist model from the bank App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/bank.qnt marks for it (`// grist: invariant`, ...).
# The clients' calls (actor bank/<tenant>/clients: qobs.Invoke before the first
# request, Call.Done with the answer, every retry inside the one call),
# linearized by qtest.Linearize: no positions, no processors.
actors: ['bank/*/clients']
spec: model/bank.qnt
module: bankCalls

outcomes:
  ok: '"ok"'
  unknown-account: '"unknown-account"'
  denied: '"denied"'

actions:
  pay:
    args: { result: '{{.outcome}}' }

invariants: []

# The model on its own (gotogether simulate)
simulate:
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: pay.ok
      when: 'nextID(answered) != Set() and STRS.exists(account => INTS.exists(amount => STRS.exists(payout => STRS.exists(caller => payOutcome(log, { account: account, amount: amount, payout: payout, caller: caller }) == "ok"))))'
    - name: pay.unknown-account
      when: 'nextID(answered) != Set() and STRS.exists(account => INTS.exists(amount => STRS.exists(payout => STRS.exists(caller => payOutcome(log, { account: account, amount: amount, payout: payout, caller: caller }) == "unknown-account"))))'
