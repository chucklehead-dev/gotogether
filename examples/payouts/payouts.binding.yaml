# Generated by grist model from the payouts App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/payouts.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor payouts/<tenant>): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['payouts/*', '!*/clients']
spec: model/payouts.qnt
module: payouts

outcomes:
  ok: '"ok"'
  duplicate: '"duplicate"'
  invalid: '"invalid"'
  unknown: '"unknown"'
  unknown-account: '"unknown-account"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  request:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  sendEffect: {}
  send:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("send") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  sendOutcome: {}
  sendSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("send") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  bankPay:
    args: { result: '{{.outcome}}' }
  gristRewound: {}
  gristResumed: {}

invariants: [oneSentPerPayout]
eventually: [sendEventuallyHandled]

# The model on its own (gotogether simulate)
simulate:
  holds: [oneSentPerPayout]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: request.ok
      when: 'nextID(answered) != Set() and STRS.exists(payout => STRS.exists(account => INTS.exists(amount => STRS.exists(caller => requestOutcome(log, { payout: payout, account: account, amount: amount, caller: caller }) == "ok"))))'
    - name: request.duplicate
      when: 'nextID(answered) != Set() and STRS.exists(payout => STRS.exists(account => INTS.exists(amount => STRS.exists(caller => requestOutcome(log, { payout: payout, account: account, amount: amount, caller: caller }) == "duplicate"))))'
    - name: request.invalid
      when: 'nextID(answered) != Set() and STRS.exists(payout => STRS.exists(account => INTS.exists(amount => STRS.exists(caller => requestOutcome(log, { payout: payout, account: account, amount: amount, caller: caller }) == "invalid"))))'
    - sendEffect
    - send
    - bankPay
