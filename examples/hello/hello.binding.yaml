# How the counter's recorded steps become calls of model/hello.qnt's
# actions. Both take the step's id (the default), so only the observed
# count needs saying.
spec: model/hello.qnt
module: hello

constants:
  REQUESTS: '1.to(3)'

actions:
  apply:
    expect: 'count == {{.obs.count}}'
  replay:
    expect: 'count == {{.obs.count}}'
  done: {}

invariants: [exactlyOnce]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  holds: [exactlyOnce]
  # what the model must be able to do: a request applied and then seen
  # again (a retry, a duplicate), recognised as a replay; the client done.
  # A model too strict for either would judge a counter that never meets a
  # retry faithful
  possible:
    - name: a retry recognised
      steps: [apply, replay]
    - done
