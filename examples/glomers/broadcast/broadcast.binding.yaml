# Recorded broadcast steps as calls of ../model/broadcast.qnt. Every
# parameter is the step field of its name (gossip's values, a Set, is
# converted from the recorded JSON array by default).
spec: ../model/broadcast.qnt
module: broadcast
constants:
  NODES: '{{ set "node" "src" "dst" }}'
  VALUES: '{{ set "value" }}'
actions:
  broadcast: {}
  gossip: {}
  deliver: {}
  read:
    expect: 'seen.get({{.node}}) == {{ toSet .obs.values }}'
  settle: {}
invariants: [noInvention, convergedWhenSettled]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  constants: {NODES: 'Set("n0", "n1", "n2")', VALUES: 'Set(1, 2, 3)'}
  holds: [noInvention, convergedWhenSettled]
  verifySteps: 6 # Apalache: 32 s at 6 steps, past 8 minutes at 8
