# Recorded uniqueids steps as calls of ../model/uniqueids.qnt.
spec: ../model/uniqueids.qnt
module: uniqueids
constants:
  NODES: '{{ set "node" }}'
actions:
  generate: {}
invariants: [idsUnique]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  constants: {NODES: 'Set("n0", "n1", "n2")'}
  allows: [idsUnique]
