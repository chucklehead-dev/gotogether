# Recorded uniqueids steps as calls of ../model/uniqueidsScheme.qnt: the
# parts an id is built from, not the id. Sound only together with the
# encoding's injectivity (TestIDEncodingInjective).
spec: ../model/uniqueidsScheme.qnt
module: uniqueidsScheme
constants:
  NODES: '{{ set "node" }}'
actions:
  generate: {}
invariants: [incarnationsOwnedAndCounting]

# The model on its own (gotogether simulate).
simulate:
  skip: "a replay-only model: generate takes the observed incarnation and counter"
