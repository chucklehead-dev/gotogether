# Recorded kafka steps as calls of ../model/kafka.qnt. log* and commit*
# steps come from lin-kv. Parameters default to the step fields of their
# names; List parameters are converted from JSON arrays by their type.
spec: ../model/kafka.qnt
module: kafka
constants:
  KEYS: '{{ set "key" }}'
  NODES: '{{ set "node" }}'
actions:
  logRead:    {}
  logCas:     {}
  logWrite:   {}
  commitRead: {}
  commitCas:  {}
  sendOk:     {}
  pollOk:
    # every polled message is the log's at its offset, offsets consecutive from the one asked for
    expect: >-
      {{ toList .obs.msgs }}.indices().forall(i =>
        val p = {{ toList .obs.msgs }}[i]
        p._1 == {{.from}} + i and orEmpty(logs, {{.key}}).length() > p._1 and orEmpty(logs, {{.key}})[p._1] == p._2)
  listOk:
    expect: 'orNone(commits, {{.key}}) >= {{.obs.offset}}'
  settle: {}
invariants: [sentAtItsOffset, offsetsUnique, commitsInLog]

# The model on its own (gotogether simulate).
simulate:
  skip: "a replay-only model: its actions take the values the nodes observed in the KV services"
