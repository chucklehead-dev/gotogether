# How recorded bank steps become calls of model/bank.qnt's actions. The same
# binding serves the qobs-recorded steps (bank.go's qobs.Record calls) and
# steps converted from the bank's own OTel spans (bank.convert.yaml).
spec: model/bank.qnt
module: bank

# The instance to check against: the deployed accounts, and amounts up to
# the largest one seen (constants may be templates over the whole run).
constants:
  ACCOUNTS: 'Set("alice", "bob", "carol")'
  MAX_AMOUNT: '{{ atLeast 5 (max "amount") }}'

actions:
  deposit:
    # A refused operation changed nothing: the model has no such step.
    outcomes: { error: skip }
    expect: 'balances.get({{.account}}) == {{.obs.balance}}'
  withdraw:
    outcomes: { error: skip }
    expect: 'balances.get({{.account}}) == {{.obs.balance}}'
  transfer:
    outcomes: { error: skip }
    expect: 'balances.get({{.src}}) == {{.obs.src_balance}} and balances.get({{.dst}}) == {{.obs.dst_balance}}'

invariants: [noOverdraft]

# The model on its own (gotogether simulate): which invariants the design
# guarantees, which it allows to fail and the code must not.
simulate:
  constants: {MAX_AMOUNT: '5'}
  holds: [noOverdraft]
