# The server's effects (recorded where it makes them: created, finished,
# cancelled, drained) and the page as Bombadil saw it (qdriver/bombadil:
# each request a click sent an invocation, completed only by that
# request's own answer; each change of the job the page shows) as calls
# of model/webjobs.qnt's actions: every parameter is the step's field of
# its name. The two recorders are ordered by their wall clocks, on one
# host. Nothing is compared step by step: the invariants judge every
# state, the eventual vals the last state of a run that settled (the
# server, drained).
spec: model/webjobs.qnt
module: webjobs

actions:
  created: {}
  finished: {}
  cancelled: {}
  drained: {}
  submit: {}
  cancel: {}
  show: {}

invariants: [oneJobPerKey, answerIsItsJob, shownIsAJob, readyIsCommitted, cancelHonoured, noFailedRequest,
  finishedOnce, noCommitAfterCancel, createdOnce]
# the journey's end, for the server (drained, every job ended) and for the
# page (every job it was answered with shown ended)
eventually: [allResolved, pageShowsEnds]

# a journey is judged whole: gotogether validate fails a run that did not
# settle, or left a request with no answer (as -require-settle)
complete: true

# a job runs for at most 1.2s, then is ready (or was cancelled): with
# one job at a time, the server is idle again within 3s of starting one
within:
  - after: running
    holds: idle
    bound: 3s
  # a job committed is shown ended within 500ms: the page polls every
  # 100ms (a recorded run's lag, commit to snapshot, is under 200ms)
  - after: unseenReady
    holds: readySeen
    bound: 500ms

antecedents:
  answerIsItsJob: answers.keys().size() > 0
  shownIsAJob: shown.keys().size() > 0
  readyIsCommitted: shown.keys().exists(id => shown.get(id) == "ready")
  cancelHonoured: acked.size() > 0 or shown.keys().exists(id => shown.get(id) == "cancelled")
  oneJobPerKey: jobs.keys().size() > 1
  finishedOnce: commits.keys().size() > 0
  noCommitAfterCancel: everCancelled.size() > 0
  createdOnce: creations.keys().size() > 0

# The model on its own (gotogether simulate): it allows every bug the
# invariants rule out, so none holds by construction.
simulate:
  allows: [oneJobPerKey, answerIsItsJob, shownIsAJob, readyIsCommitted, cancelHonoured, noFailedRequest,
    finishedOnce, noCommitAfterCancel, createdOnce]
