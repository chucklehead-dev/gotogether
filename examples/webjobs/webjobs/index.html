<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webjobs</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  button { font: inherit; padding: 6px 12px; margin-right: 8px; }
  #result { font: 14px ui-monospace, monospace; min-height: 1.4em; }
</style>
</head>
<body>
<h1>Reports</h1>
<form id="form">
  <button id="submit" type="submit">Generate report</button>
  <button id="cancel" type="button" disabled>Cancel</button>
</form>
<p id="result" aria-live="polite"></p>
<pre id="log" hidden></pre>
<script>
// One submission at a time. Each has a key, made when the form is ready
// for it and kept until its job ends, so a second click (a double click,
// a retry) asks for the same job. The result shows the job as the server
// last answered: {"id", "status"}. #log lists the page's last three requests
// (submits and cancels, numbered n from 1 as sent) with what each sent
// and, once answered, its own answer: its HTTP status (0: no answer, a
// network error) and the job it named. A ?until=<ms since the epoch>
// stops new submissions then, so a journey a driver runs for a time
// limit ends with its jobs shown ended.
const form = document.getElementById('form');
const submit = document.getElementById('submit');
const cancel = document.getElementById('cancel');
const result = document.getElementById('result');
const logEl = document.getElementById('log');
const until = Number(new URLSearchParams(location.search).get('until')) || Infinity;
let current = null;     // the job shown
const answered = new Set(); // keys whose submission was answered
const requests = [];
let polling = null;

function newKey() {
  form.dataset.key = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function enable() {
  const running = current !== null && current.status === 'accepted';
  submit.disabled = running || Date.now() >= until;
  cancel.disabled = !running;
}

// sent logs a request as it is sent; answer logs its own answer.
function sent(op, args) {
  const r = { n: requests.length + 1, op, ...args, code: null, job: null };
  requests.push(r);
  logEl.textContent = JSON.stringify(requests.slice(-3));
  return r;
}

// the answer is logged whole, its status with its body, once the body
// is read: a log shown in between holds the request unanswered
async function answer(r, res) {
  let job = null;
  try {
    const b = res ? await res.json() : null;
    if (b && b.id) job = { id: b.id, status: b.status };
  } catch (e) { /* no JSON: the status alone */ }
  r.code = res ? res.status : 0;
  r.job = job;
  logEl.textContent = JSON.stringify(requests.slice(-3));
  return job;
}

async function send(op, args, url, init) {
  const r = sent(op, args);
  let res = null;
  try { res = await fetch(url, init); } catch (e) { /* no answer */ }
  return { ok: res !== null && (res.ok || res.status === 409), job: await answer(r, res) };
}

function show(job) {
  // a job's status only moves on: a poll answered after a cancel's
  // answer is stale
  if (current && current.id === job.id && current.status !== 'accepted' && job.status === 'accepted') return;
  current = { id: job.id, status: job.status };
  result.textContent = JSON.stringify(current);
  enable();
  clearTimeout(polling);
  if (job.status === 'accepted') polling = setTimeout(poll, 100);
  else newKey();
}

async function poll() {
  const id = current.id;
  try {
    const res = await fetch('/jobs/' + id, { cache: 'no-store' });
    if (res.ok && current.id === id) show(await res.json());
    else if (current.id === id) polling = setTimeout(poll, 100);
  } catch (e) {
    if (current.id === id) polling = setTimeout(poll, 100);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (submit.disabled) return;
  const key = form.dataset.key;
  const { ok, job } = await send('submit', { key }, '/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key }) });
  if (!ok || !job || answered.has(key)) return; // the first answer for a key is the one shown
  answered.add(key);
  show(job);
});

cancel.addEventListener('click', async () => {
  if (!current) return;
  const { ok, job } = await send('cancel', { id: current.id }, '/jobs/' + current.id + '/cancel', { method: 'POST' });
  if (ok && job) show(job);
});

if (until !== Infinity) setTimeout(enable, Math.max(0, until - Date.now()));
newKey();
</script>
</body>
</html>
