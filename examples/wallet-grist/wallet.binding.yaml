# Generated by grist model from the wallet App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/wallet.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/wallet.qnt
module: wallet

outcomes:
  ok: '"ok"'
  insufficient-funds: '"insufficient-funds"'
  invalid: '"invalid"'
  unknown: '"unknown"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  deposit:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  transfer:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  read:
    expect: 'readAnswer(log, { account: {{.account}}, caller: {{.caller}} }) == { balance: {{.obs.balance}} }'
  postEffect: {}
  post:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("post") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  postOutcome: {}
  postSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("post") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  ledgerPost:
    args: { result: '{{.outcome}}' }
  ledgerPostServed:
    args: { result: '{{.outcome}}' }
  ledgerPostReplayed:
    args: { result: '{{.outcome}}' }
  gristRewound: {}
  gristResumed: {}

invariants: [noOverdraft]
eventually: [postedApplied, postEventuallyHandled, ledgerPostEventuallyServed]

# The model on its own (gotogether simulate)
simulate:
  holds: [noOverdraft]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: deposit.ok
      when: 'nextID(answered) != Set() and STRS.exists(account => INTS.exists(amount => STRS.exists(caller => depositOutcome(log, { account: account, amount: amount, caller: caller }) == "ok")))'
    - name: deposit.invalid
      when: 'nextID(answered) != Set() and STRS.exists(account => INTS.exists(amount => STRS.exists(caller => depositOutcome(log, { account: account, amount: amount, caller: caller }) == "invalid")))'
    - name: transfer.ok
      when: 'nextID(answered) != Set() and STRS.exists(src => STRS.exists(dest => INTS.exists(amount => STRS.exists(caller => transferOutcome(log, { src: src, dest: dest, amount: amount, caller: caller }) == "ok"))))'
    - name: transfer.invalid
      when: 'nextID(answered) != Set() and STRS.exists(src => STRS.exists(dest => INTS.exists(amount => STRS.exists(caller => transferOutcome(log, { src: src, dest: dest, amount: amount, caller: caller }) == "invalid"))))'
    - name: transfer.insufficient-funds
      when: 'nextID(answered) != Set() and STRS.exists(src => STRS.exists(dest => INTS.exists(amount => STRS.exists(caller => transferOutcome(log, { src: src, dest: dest, amount: amount, caller: caller }) == "insufficient-funds"))))'
    - read
    - postEffect
    - post
    - ledgerPost
    - ledgerPostServed
