# Generated by grist model from the wallet App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/wallet.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/wallet.qnt
module: wallet

outcomes:
  ok: '"ok"'
  insufficient-funds: '"insufficient-funds"'
  invalid: '"invalid"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  deposit:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  transfer:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  read:
    expect: 'readAnswer(log, { account: {{.account}}, principal: {{.principal}} }) == { balance: {{.obs.balance}} }'
  postEffect: {}
  post:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("post") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  postOutcome: {}
  ledgerPost: {}

invariants: [noOverdraft]
eventually: [allPosted, postedApplied]

# The model on its own (gotogether simulate)
simulate:
  holds: [noOverdraft]
