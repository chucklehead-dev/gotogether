# Generated by grist model from the wallet App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/wallet.qnt marks for it (`// grist: invariant`, ...).
# The clients' calls (actor <tenant>/clients: qobs.Invoke before the first
# request, Call.Done with the answer, every retry inside the one call),
# linearized by qtest.Linearize: no positions, no processors.
actors: ['*/clients']
spec: model/wallet.qnt
module: walletCalls

outcomes:
  ok: '"ok"'
  insufficient-funds: '"insufficient-funds"'
  invalid: '"invalid"'
  conflict: '"conflict"'
  denied: '"denied"'

actions:
  deposit:
    args: { result: '{{.outcome}}' }
  transfer:
    args: { result: '{{.outcome}}' }
  read:
    expect: 'readAnswer(log, { account: {{.account}}, principal: {{.principal}} }) == { balance: {{.obs.balance}} }'

invariants: [noOverdraft]

# The model on its own (gotogether simulate)
simulate:
  holds: [noOverdraft]
