# The clients' calls (actor <tenant>/clients: qobs.Invoke before the first
# request, Call.Done with the answer, every retry inside the one call),
# linearized by qtest.Linearize: no positions, no processors.
actors: ['*/clients']
spec: model/library.qnt
module: libraryCalls

outcomes:
  ok: '"ok"'
  already-member: '"already-member"'
  invalid: '"invalid"'
  limit: '"limit"'
  not-held: '"not-held"'
  not-member: '"not-member"'
  unavailable: '"unavailable"'
  conflict: '"conflict"'
  denied: '"denied"'

actions:
  addBook:
    args: { result: '{{.outcome}}' }
  borrow:
    args: { result: '{{.outcome}}' }
  join:
    args: { result: '{{.outcome}}' }
  returnBook:
    args: { result: '{{.outcome}}' }
  memberLoans:
    expect: 'memberLoansAnswer(log, { member: {{.member}}, principal: {{.principal}} }) == { count: {{.obs.count}} }'

invariants: [copiesHeld, withinLimit]

# The model on its own (gotogether simulate)
simulate:
  holds: [copiesHeld, withinLimit]
