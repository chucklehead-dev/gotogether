# Generated by grist model from the library App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/library.qnt marks for it (`// grist: invariant`, ...).
# The clients' calls (actor library/<tenant>/clients: qobs.Invoke before the first
# request, Call.Done with the answer, every retry inside the one call),
# linearized by qtest.Linearize: no positions, no processors.
actors: ['library/*/clients']
spec: model/library.qnt
module: libraryCalls

outcomes:
  ok: '"ok"'
  already-member: '"already-member"'
  invalid: '"invalid"'
  limit: '"limit"'
  not-held: '"not-held"'
  not-member: '"not-member"'
  unavailable: '"unavailable"'
  conflict: '"conflict"'
  denied: '"denied"'

actions:
  addBook:
    args: { result: '{{.outcome}}' }
  borrow:
    args: { result: '{{.outcome}}' }
  join:
    args: { result: '{{.outcome}}' }
  returnBook:
    args: { result: '{{.outcome}}' }
  memberLoans:
    expect: 'memberLoansAnswer(log, { member: {{.member}}, caller: {{.caller}} }) == { count: {{.obs.count}} }'

invariants: [copiesHeld, withinLimit]

# The model on its own (gotogether simulate)
simulate:
  holds: [copiesHeld, withinLimit]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: addBook.ok
      when: 'nextID(answered) != Set() and STRS.exists(book => INTS.exists(arg_copies => STRS.exists(caller => addBookOutcome(log, { book: book, copies: arg_copies, caller: caller }) == "ok")))'
    - name: addBook.invalid
      when: 'nextID(answered) != Set() and STRS.exists(book => INTS.exists(arg_copies => STRS.exists(caller => addBookOutcome(log, { book: book, copies: arg_copies, caller: caller }) == "invalid")))'
    - name: borrow.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => borrowRuled(log, { member: member, book: book, caller: caller }).outcome == "ok")))'
    - name: borrow.not-member
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => borrowRuled(log, { member: member, book: book, caller: caller }).outcome == "not-member")))'
    - name: borrow.unavailable
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => borrowRuled(log, { member: member, book: book, caller: caller }).outcome == "unavailable")))'
    - name: borrow.limit
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => borrowRuled(log, { member: member, book: book, caller: caller }).outcome == "limit")))'
    - name: join.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(caller => joinOutcome(log, { member: member, caller: caller }) == "ok"))'
    - name: join.already-member
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(caller => joinOutcome(log, { member: member, caller: caller }) == "already-member"))'
    - name: returnBook.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => returnBookOutcome(log, { member: member, book: book, caller: caller }) == "ok")))'
    - name: returnBook.not-held
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(caller => returnBookOutcome(log, { member: member, book: book, caller: caller }) == "not-held")))'
    - memberLoans
