# Generated by grist model from the library App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/library.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/library.qnt
module: library

outcomes:
  ok: '"ok"'
  already-member: '"already-member"'
  invalid: '"invalid"'
  limit: '"limit"'
  not-held: '"not-held"'
  not-member: '"not-member"'
  unavailable: '"unavailable"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  addBook:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  borrow:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  join:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  returnBook:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  memberLoans:
    expect: 'memberLoansAnswer(log, { member: {{.member}}, principal: {{.principal}} }) == { count: {{.obs.count}} }'
  receiptsEffect: {}
  receipts:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("receipts") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  receiptsOutcome: {}
  receiptsSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("receipts") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  mailerSends: {}

invariants: [copiesHeld, withinLimit]
eventually: [everyReceiptForABorrow, everyBorrowReceipted]

# The model on its own (gotogether simulate)
simulate:
  holds: [copiesHeld, withinLimit]
