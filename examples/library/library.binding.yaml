# Generated by grist model from the library App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/library.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/library.qnt
module: library

outcomes:
  ok: '"ok"'
  already-member: '"already-member"'
  invalid: '"invalid"'
  limit: '"limit"'
  not-held: '"not-held"'
  not-member: '"not-member"'
  unavailable: '"unavailable"'
  unknown: '"unknown"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  addBook:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  borrow:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  join:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  returnBook:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  memberLoans:
    expect: 'memberLoansAnswer(log, { member: {{.member}}, principal: {{.principal}} }) == { count: {{.obs.count}} }'
  receiptsEffect: {}
  receipts:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("receipts") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  receiptsOutcome: {}
  receiptsSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("receipts") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  mailerSend:
    args: { result: '{{.outcome}}' }
  mailerSendServed:
    args: { result: '{{.outcome}}' }
  mailerSendReplayed:
    args: { result: '{{.outcome}}' }

invariants: [copiesHeld, withinLimit]
eventually: [everyBorrowReceipted]

# The model on its own (gotogether simulate)
simulate:
  holds: [copiesHeld, withinLimit]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: addBook.ok
      when: 'nextID(answered) != Set() and STRS.exists(book => INTS.exists(copies => STRS.exists(principal => addBookOutcome(log, { book: book, copies: copies, principal: principal }) == "ok")))'
    - name: addBook.invalid
      when: 'nextID(answered) != Set() and STRS.exists(book => INTS.exists(copies => STRS.exists(principal => addBookOutcome(log, { book: book, copies: copies, principal: principal }) == "invalid")))'
    - name: borrow.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => borrowRuled(log, { member: member, book: book, principal: principal }).outcome == "ok")))'
    - name: borrow.not-member
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => borrowRuled(log, { member: member, book: book, principal: principal }).outcome == "not-member")))'
    - name: borrow.unavailable
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => borrowRuled(log, { member: member, book: book, principal: principal }).outcome == "unavailable")))'
    - name: borrow.limit
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => borrowRuled(log, { member: member, book: book, principal: principal }).outcome == "limit")))'
    - name: join.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(principal => joinOutcome(log, { member: member, principal: principal }) == "ok"))'
    - name: join.already-member
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(principal => joinOutcome(log, { member: member, principal: principal }) == "already-member"))'
    - name: returnBook.ok
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => returnBookOutcome(log, { member: member, book: book, principal: principal }) == "ok")))'
    - name: returnBook.not-held
      when: 'nextID(answered) != Set() and STRS.exists(member => STRS.exists(book => STRS.exists(principal => returnBookOutcome(log, { member: member, book: book, principal: principal }) == "not-held")))'
    - memberLoans
    - receiptsEffect
    - receipts
    - mailerSend
    - mailerSendServed
