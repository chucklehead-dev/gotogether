# Generated by grist model from the inventory App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/inventory.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor inventory/<tenant>): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['inventory/*', '!*/clients']
spec: model/inventory.qnt
module: inventory

outcomes:
  ok: '"ok"'
  cancelled: '"cancelled"'
  full: '"full"'
  not-held: '"not-held"'
  too-late: '"too-late"'
  unknown: '"unknown"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  authorize:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  cancel:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  reserve:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  shipEffect: {}
  ship:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("ship") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  shipOutcome: {}
  shipSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("ship") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  fulfillmentStart:
    args: { result: '{{.outcome}}' }
  gristRewound: {}
  gristResumed: {}

invariants: [withinCapacity]
eventually: [shipEventuallyHandled]

# The model on its own (gotogether simulate)
simulate:
  holds: [withinCapacity]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: authorize.ok
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => authorizeOutcome(log, { order: order, caller: caller }) == "ok"))'
    - name: authorize.not-held
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => authorizeOutcome(log, { order: order, caller: caller }) == "not-held"))'
    - name: cancel.ok
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => cancelOutcome(log, { order: order, caller: caller }) == "ok"))'
    - name: cancel.too-late
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => cancelOutcome(log, { order: order, caller: caller }) == "too-late"))'
    - name: reserve.ok
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => reserveOutcome(log, { order: order, caller: caller }) == "ok"))'
    - name: reserve.cancelled
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => reserveOutcome(log, { order: order, caller: caller }) == "cancelled"))'
    - name: reserve.too-late
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => reserveOutcome(log, { order: order, caller: caller }) == "too-late"))'
    - name: reserve.full
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => reserveOutcome(log, { order: order, caller: caller }) == "full"))'
    - shipEffect
    - ship
    - fulfillmentStart
