# Generated by grist model from the fulfillment App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/fulfillment.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor fulfillment/<tenant>): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['fulfillment/*', '!*/clients']
spec: model/fulfillment.qnt
module: fulfillment

outcomes:
  ok: '"ok"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  start:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  gristRewound: {}
  gristResumed: {}

invariants: [oneShipmentPerOrder]

# The model on its own (gotogether simulate)
simulate:
  allows: [oneShipmentPerOrder]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: start.ok
      when: 'nextID(answered) != Set() and STRS.exists(order => STRS.exists(caller => startOutcome(log, { order: order, caller: caller }) == "ok"))'
