# The clients' calls and the probe's observations as calls of
# model/quorumkv.qnt's actions: every parameter is the step's field of its
# name; a read's observed value is the key's register.
spec: model/quorumkv.qnt
module: quorumkv

constants:
  KEYS: 'Set("a", "b")'
  REPLICAS: 'Set("r1", "r2", "r3")'

actions:
  write: {}
  read:
    expect: 'reg.get({{.key}}) == {{.obs.val}}'
  observe: {}

eventually: [converged]

# The model on its own (gotogether simulate -graph): converged is the
# code's to reach. The model's observe records what a probe saw, any
# value, so a fair cycle of writes and observations keeps it false
# forever: the graph's liveness search reports that lasso, which this
# says the model allows (DESIGN §62).
simulate:
  allows: [converged]
