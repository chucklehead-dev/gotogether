# Generated by grist model from the counters App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/counters.qnt marks for it (`// grist: invariant`, ...).
# The clients' calls (actor <tenant>/clients: qobs.Invoke before the first
# request, Call.Done with the answer, every retry inside the one call),
# linearized by qtest.Linearize: no positions, no processors.
actors: ['*/clients']
spec: model/counters.qnt
module: countersCalls

outcomes:
  ok: '"ok"'
  name-taken: '"name-taken"'
  not-creator: '"not-creator"'
  unknown-counter: '"unknown-counter"'
  conflict: '"conflict"'
  denied: '"denied"'

actions:
  createCounter:
    args: { result: '{{.outcome}}' }
  incrementCounter:
    args: { result: '{{.outcome}}' }
  retireCounter:
    args: { result: '{{.outcome}}' }
  showCounter:
    expect: 'showCounterAnswer(log, { counter: {{.counter}}, caller: {{.caller}} }) == { total: {{.obs.total}}, names: {{.obs.names}} }'

invariants: [uniqueNames]

# The model on its own (gotogether simulate)
simulate:
  holds: [uniqueNames]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: createCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(name => STRS.exists(caller => createCounterOutcome(log, { counter: counter, name: name, caller: caller }) == "ok")))'
    - name: createCounter.name-taken
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(name => STRS.exists(caller => createCounterOutcome(log, { counter: counter, name: name, caller: caller }) == "name-taken")))'
    - name: incrementCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => INTS.exists(by => STRS.exists(caller => incrementCounterOutcome(log, { counter: counter, by: by, caller: caller }) == "ok")))'
    - name: incrementCounter.unknown-counter
      when: 'nextID(answered) != Set() and STRS.exists(counter => INTS.exists(by => STRS.exists(caller => incrementCounterOutcome(log, { counter: counter, by: by, caller: caller }) == "unknown-counter")))'
    - name: retireCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(caller => retireCounterOutcome(log, { counter: counter, caller: caller }) == "ok"))'
    - name: retireCounter.unknown-counter
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(caller => retireCounterOutcome(log, { counter: counter, caller: caller }) == "unknown-counter"))'
    - name: retireCounter.not-creator
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(caller => retireCounterOutcome(log, { counter: counter, caller: caller }) == "not-creator"))'
    - showCounter
