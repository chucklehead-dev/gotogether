# The steps grist records at the store (gristsim's AtCommits) as calls of
# model/counters.qnt's actions: every parameter is the step's field of its
# name (a command's fields, its id, the read set it read and committed
# under: readPos and reads, slice 1's triples turned into grist.qnt's Reads
# by readsOf), but result, which is the step's outcome. Each commit's
# observations (a refusal's too: it commits its marker) are the head after
# it and the batch it appended (types, string fields, integer fields,
# causes), compared with the model's; a query's answer with the read
# models' defs at its position. Every step of a tenant has actor the
# tenant and process the store, so a node's crash changes no process:
# there is no restart action.
spec: model/counters.qnt
module: counters

outcomes:
  ok: '"ok"'
  name-taken: '"name-taken"'
  unknown-counter: '"unknown-counter"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  createCounter:
    args: { result: '{{.outcome}}', reads: 'readsOf({{toList .reads}})' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  incrementCounter:
    args: { result: '{{.outcome}}', reads: 'readsOf({{toList .reads}})' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  showCounter:
    expect: 'total(log, {{.counter}}) == {{.obs.total}} and namesOf(log, {{.counter}}) == {{.obs.names}}'
  average:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("average") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  welcomeEffect: {}
  welcome:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("welcome") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'

invariants: [uniqueNames, averageAsOfTrigger]
eventually: [everyCounterWelcomedOrFailed]

# The model on its own (gotogether simulate): both invariants are the
# design's, which no run of the model violates.
simulate:
  holds: [uniqueNames, averageAsOfTrigger]
