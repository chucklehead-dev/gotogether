# Generated by grist model from the counters App's catalog (docs/grist.md §3.2): do not edit;
# regenerate with the app's binary (`<app> model`, grist.Main). Its invariants
# are the vals model/counters.qnt marks for it (`// grist: invariant`, ...).
# The store's steps (actor the tenant): every parameter the step's field, the
# outcome as result, each commit's head and batch, each query's answer
# compared with the model's. No restart: every step's process is the store.
actors: ['!*/clients']
spec: model/counters.qnt
module: counters

outcomes:
  ok: '"ok"'
  declined: '"declined"'
  name-taken: '"name-taken"'
  not-creator: '"not-creator"'
  unknown: '"unknown"'
  unknown-counter: '"unknown-counter"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  createCounter:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  incrementCounter:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  retireCounter:
    args: { result: '{{.outcome}}' }
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  showCounter:
    expect: 'showCounterAnswer(log, { counter: {{.counter}}, principal: {{.principal}} }) == { total: {{.obs.total}}, names: {{.obs.names}} }'
  average:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("average") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  welcomeEffect: {}
  welcome:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("welcome") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  welcomeOutcome: {}
  welcomeSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("welcome") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  payoutSkip:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("payout") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  payout:
    expect: 'log.length() == {{.obs.head}} and checkpoints.get("payout") == {{.obs.checkpoint}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  payoutEffect: {}
  payoutOutcome:
    expect: 'log.length() == {{.obs.head}} and batchIs(appended, {{toList .obs.events}}, {{toList .obs.strs}}, {{toList .obs.ints}}, {{toList .obs.causes}})'
  mailerSend:
    args: { result: '{{.outcome}}' }
  mailerSendServed:
    args: { result: '{{.outcome}}' }
  mailerSendReplayed:
    args: { result: '{{.outcome}}' }
  bankPay:
    args: { result: '{{.outcome}}' }
  bankPayServed:
    args: { result: '{{.outcome}}' }
  bankPayReplayed:
    args: { result: '{{.outcome}}' }

invariants: [uniqueNames, averageAsOfTrigger]
eventually: [everyCounterWelcomedOrFailed, everyPaymentAnswerServed, everyMailAnswerServed]

# The model on its own (gotogether simulate)
simulate:
  holds: [uniqueNames, averageAsOfTrigger]
  # every outcome of every command, and every processor's steps, each reachable by the
  # model on its own: one its rules forbid is one no conforming run can show (P3)
  possible:
    - name: createCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(name => STRS.exists(principal => createCounterOutcome(log, { counter: counter, name: name, principal: principal }) == "ok")))'
    - name: createCounter.name-taken
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(name => STRS.exists(principal => createCounterOutcome(log, { counter: counter, name: name, principal: principal }) == "name-taken")))'
    - name: incrementCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => INTS.exists(by => STRS.exists(principal => incrementCounterOutcome(log, { counter: counter, by: by, principal: principal }) == "ok")))'
    - name: incrementCounter.unknown-counter
      when: 'nextID(answered) != Set() and STRS.exists(counter => INTS.exists(by => STRS.exists(principal => incrementCounterOutcome(log, { counter: counter, by: by, principal: principal }) == "unknown-counter")))'
    - name: retireCounter.ok
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(principal => retireCounterOutcome(log, { counter: counter, principal: principal }) == "ok"))'
    - name: retireCounter.unknown-counter
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(principal => retireCounterOutcome(log, { counter: counter, principal: principal }) == "unknown-counter"))'
    - name: retireCounter.not-creator
      when: 'nextID(answered) != Set() and STRS.exists(counter => STRS.exists(principal => retireCounterOutcome(log, { counter: counter, principal: principal }) == "not-creator"))'
    - showCounter
    - average
    - welcomeEffect
    - welcome
    - payoutEffect
    - payout
    - payoutOutcome
    - mailerSend
    - mailerSendServed
    - bankPay
    - bankPayServed
