# counters.retiring.binding.yaml's model and steps, judged by two
# test-only eventual vals, what the payout's declared guarantee (at most
# once) does not promise: everyRetirementPaidOnce (every retirement paid
# exactly once, by the bank's own record of its payments, after the
# settle), which the payment a crash between its checkpoint and the
# bank's call loses fails, and everyPayoutOutcomeLogged (every payment
# step's outcome in the log), which the outcome a crash after the payment
# loses fails. The retiring binding admits both losses.
actors: ['!*/clients']
spec: model/counters.qnt
module: counters

outcomes:
  ok: '"ok"'
  name-taken: '"name-taken"'
  unknown-counter: '"unknown-counter"'
  not-creator: '"not-creator"'
  conflict: '"conflict"'
  idempotency-key-reused: '"idempotency-key-reused"'

actions:
  createCounter:
    args: { result: '{{.outcome}}', reads: 'readsOf({{toList .reads}})' }
  incrementCounter:
    args: { result: '{{.outcome}}', reads: 'readsOf({{toList .reads}})' }
  retireCounter:
    args: { result: '{{.outcome}}', reads: 'readsOf({{toList .reads}})' }
  showCounter: {}
  average: {}
  welcomeEffect: {}
  welcome: {}
  welcomeOutcome: {}
  payout: {}
  payoutEffect: {}
  payoutOutcome: {}
  bankPays: {}

invariants: []
eventually: [everyRetirementPaidOnce, everyPayoutOutcomeLogged]
